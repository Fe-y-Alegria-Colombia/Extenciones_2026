<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extensiones - Fe y Alegría Colombia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Extensiones Telefónicas</h1>
      <p class="subtitle">Oficina Nacional Fe y Alegría Colombia</p>
    </header>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Buscar por extensión, área o nombre..."
        autocomplete="off"
      />
    </div>

    <div class="table-wrapper">
      <table id="extensionsTable">
        <thead>
          <tr>
            <th>Extensión</th>
            <th>Área</th>
            <th>Nombre</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
      <p id="noResults" class="no-results" hidden>No se encontraron resultados.</p>
    </div>

    <footer>
      <p>Consultar extensiones internas · Fe y Alegría Colombia</p>
    </footer>
  </div>

    window.extensionsData = [

      { extension: "1009", area: "Logística", name: "Diego Torres" },

  <script src="app.js"></script>
</body>
</html>
